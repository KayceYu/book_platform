name: Deploy Cougeju to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS backend URL; defaults to config/pages.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify the shared backend
        run: node scripts/check-backend.mjs
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      - name: Build the Pages frontend
        run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const site = process.env.SITE_URL;
          async function get(url) {
            const response = await fetch(url, {signal: AbortSignal.timeout(20000)});
            if (!response.ok) throw new Error(`Website returned ${response.status}: ${url}`);
            return response;
          }
          let html;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              html = await (await get(site)).text();
              if (!html.includes('id="root"')) throw new Error('App entry point is missing');
              break;
            } catch (error) {
              if (attempt === 5) throw error;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          const files = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(match => new URL(match[1], site));
          if (files.length < 2) throw new Error('Frontend bundle references are missing');
          for (const file of files) await get(file);
          for (const file of ['images/weekend.webp', 'images/scenes.webp']) {
            const response = await get(new URL(file, site));
            if (!response.headers.get('content-type')?.includes('image/webp')) throw new Error('Illustration is not a WebP image');
          }
          console.log('Public website, frontend bundles and illustration assets are reachable: ' + site);
          JS
