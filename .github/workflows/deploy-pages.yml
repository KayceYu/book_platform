name: Deploy Cougeju to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS backend URL; defaults to config/pages.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify the shared backend
        run: node scripts/check-backend.mjs
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      - name: Build the Pages frontend
        run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
